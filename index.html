<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Mail</title>
  <style>
    :root {
      --bg-black: #000000;
      --bg-card: #1c1c1e;
      --bg-pill: #1c1c1e;
      --text-white: #ffffff;
      --text-secondary: #8e8e93;
      --text-subtle: #636366;
      --ios-blue: #007aff;
      --border-dark: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-black);
      color: var(--text-white);
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-black);
      position: relative;
    }

    /* iOS Top Navigation Bar */
    .top-nav {
      padding-top: calc(env(safe-area-inset-top, 47px) + 6px);
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-black);
      flex-shrink: 0;
    }

    .pill-btn {
      background: var(--bg-pill);
      color: var(--text-white);
      border: none;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .pill-btn.round {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
    }

    .top-actions-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Header Title */
    .header-title-area {
      padding: 6px 16px 12px;
      background: var(--bg-black);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-white);
    }

    .header-subtext {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* Mail List View */
    .content-view {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-black);
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;
    }

    .mail-row {
      display: flex;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border-dark);
      cursor: pointer;
      align-items: flex-start;
      position: relative;
    }

    .unread-indicator-col {
      width: 14px;
      display: flex;
      align-items: center;
      padding-top: 6px;
      flex-shrink: 0;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ios-blue);
    }

    .mail-main-col {
      flex: 1;
      min-width: 0;
    }

    .mail-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .sender-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .date-badge {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .chevron {
      color: #48484a;
      font-size: 16px;
      font-weight: 600;
    }

    .subject-line {
      font-size: 15px;
      color: var(--text-white);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .body-snippet {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* iOS Bottom Floating Action Bar */
    .ios-bottom-bar {
      padding: 8px 16px max(env(safe-area-inset-bottom), 12px);
      background: var(--bg-black);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-top: 0.5px solid var(--border-dark);
    }

    .bottom-round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
      cursor: pointer;
      flex-shrink: 0;
    }

    .bottom-round-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-white);
    }

    .bottom-search-pill {
      flex: 1;
      height: 44px;
      background: var(--bg-pill);
      border-radius: 22px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }

    .bottom-search-pill svg {
      width: 18px;
      height: 18px;
      fill: var(--text-secondary);
    }

    .bottom-search-pill input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text-white);
      font-size: 16px;
    }

    .bottom-search-pill input::placeholder {
      color: var(--text-secondary);
    }

    /* iOS Detail Reading View */
    .detail-view {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      background: var(--bg-black);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.42, 1);
    }

    .detail-view.active {
      transform: translateX(-100%);
    }

    .detail-top-nav {
      padding-top: calc(env(safe-area-inset-top, 47px) + 6px);
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-black);
      border-bottom: 0.5px solid var(--border-dark);
      flex-shrink: 0;
    }

    .detail-body-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 30px;
      background: var(--bg-black);
      -webkit-overflow-scrolling: touch;
    }

    .detail-subject {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 16px;
      color: var(--text-white);
    }

    .detail-sender-chip {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 0.5px solid var(--border-dark);
    }

    .detail-avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e91e63;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .detail-meta-info {
      flex: 1;
      cursor: pointer;
    }

    .detail-meta-name-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .detail-sender-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-white);
    }

    .detail-time-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .detail-to-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Expandable Apple Sender Details Drawer */
    .sender-details-drawer {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13.5px;
    }

    .sender-details-drawer.active {
      display: block;
    }

    .drawer-row {
      display: flex;
      margin-bottom: 8px;
    }

    .drawer-row:last-child {
      margin-bottom: 0;
    }

    .drawer-label {
      width: 60px;
      color: var(--text-secondary);
    }

    .drawer-val {
      flex: 1;
      color: var(--text-white);
    }

    .drawer-val a {
      color: var(--ios-blue);
      text-decoration: none;
    }

    .detail-email-content {
      font-size: 15px;
      line-height: 1.5;
      color: #e5e5ea;
    }

    .detail-email-content img {
      max-width: 100% !important;
      height: auto !important;
      display: block;
    }

    /* Persistent Reading Action Bar */
    .detail-reading-bottom-bar {
      padding: 10px 16px max(env(safe-area-inset-bottom), 12px);
      background: var(--bg-black);
      border-top: 0.5px solid var(--border-dark);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .reading-action-pill {
      flex: 1;
      height: 42px;
      border-radius: 21px;
      background: var(--bg-pill);
      border: 0.5px solid var(--border-dark);
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .reading-action-pill svg {
      width: 16px;
      height: 16px;
      fill: var(--text-white);
    }

    /* iOS Compose Modal Screen */
    .compose-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-black);
      z-index: 60;
      display: none;
      flex-direction: column;
      padding-top: calc(env(safe-area-inset-top, 47px) + 6px);
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
    }

    .compose-modal.active {
      display: flex;
    }

    .compose-header {
      padding: 0 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--border-dark);
    }

    .compose-field {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border-dark);
      font-size: 15px;
    }

    .compose-field label {
      color: var(--text-secondary);
      width: 70px;
    }

    .compose-field input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-size: 15px;
    }

    .compose-textarea {
      flex: 1;
      padding: 16px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-size: 16px;
      resize: none;
    }
  </style>
</head>

<div class="app-container">
  <!-- Top Navigation -->
  <div class="top-nav">
    <button class="pill-btn round" style="font-size: 15px;">❮</button>
    <div class="top-actions-right">

    </div>

      <input type="text" id="search-input" placeholder="Search" oninput="handleSearch()" />
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>

    </button>
  </div>

  <!-- iOS Reading View -->
  <div class="detail-view" id="detail-view">
    <div class="detail-top-nav">
      <button class="pill-btn round" onclick="closeDetail()">❮</button>
      <div class="top-actions-right">
        <button class="pill-btn round" onclick="deleteEmail()">🗑️</button>
        <button class="pill-btn round">•••</button>
      </div>
    </div>

    <div class="detail-body-scroll">
      <div class="detail-subject" id="read-title"></div>

      <div class="detail-sender-chip">
        <div class="detail-avatar-circle" id="read-avatar">N</div>

          <div class="detail-meta-name-row">
            <span class="detail-sender-name" id="read-sender">noreply@round1usa.com</span>
            <span class="detail-time-text" id="read-time-badge">Yesterday</span>
          </div>
          <div class="detail-to-text">
            <span>to me</span>
            <span id="chevron-drawer" style="font-size: 11px;">⌄</span>
          </div>
        </div>
      </div>

      <!-- Expandable Sender Details Drawer -->
      <div class="sender-details-drawer" id="sender-drawer">
        <div class="drawer-row">
          <span class="drawer-label">From</span>
          <span class="drawer-val" id="drawer-from">noreply@round1usa.com</span>
        </div>
        <div class="drawer-row">
          <span class="drawer-label">To</span>
          <span class="drawer-val"><a href="#">Hide My Email</a></span>
        </div>
        <div class="drawer-row">
          <span class="drawer-label">Date</span>
          <span class="drawer-val" id="drawer-date">Aug 16, 2026 at 10:02 AM</span>
        </div>
      </div>

      <div class="detail-email-content" id="read-content"></div>
    </div>

    <!-- Sticky Reading Bottom Bar -->
    <div class="detail-reading-bottom-bar">
      <button class="reading-action-pill" onclick="openCompose('Re: ')">
        <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
        <span>Reply</span>
      </button>
      <button class="reading-action-pill" onclick="openCompose('Fwd: ')">
        <svg viewBox="0 0 24 24"><path d="M14 9v-4l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
        <span>Forward</span>
      </button>
    </div>
  </div>

  <!-- iOS Compose Modal Window -->
  <div class="compose-modal" id="compose-modal">
    <div class="compose-header">
      <button class="pill-btn" onclick="closeCompose()">Cancel</button>
      <span style="font-weight: 600;">New Message</span>
      <button class="pill-btn" style="color: var(--ios-blue); font-weight: 600;" onclick="closeCompose()">Send</button>
    </div>
    <div class="compose-field">
      <label>To:</label>
      <input type="text" id="compose-to" placeholder="Recipients" />
    </div>
    <div class="compose-field">
      <label>Subject:</label>
      <input type="text" id="compose-subject" />
    </div>
    <textarea class="compose-textarea" placeholder="Sent from my iPhone"></textarea>
  </div>
</div>

            <div style="margin-bottom: 6px; color: #c7c7cc;">Example: 10 packages = $200 in game credits</div>
            <p style="font-size: 13.5px; color: #8e8e93; margin-top: 4px;">Cards are allocated and distributed solely at Round1's discretion. All purchases are final &mdash; no returns, exchanges, refunds, or substitutions will be permitted.</p>
          </div>

          <div style="margin-bottom: 16px;">
            <strong style="color: #ffffff;">Step 4: Enjoy!</strong>
            <p style="margin: 4px 0 0 0; color: #c7c7cc;">Open your mystery packages and see what you get! Share your pulls on social media and enjoy the rest of your day at Round1.</p>
          </div>

          <div style="font-size: 13px; color: #636366; border-top: 1px solid #2c2c2e; padding-top: 10px;">
            Terms &amp; Conditions (<a href="#" style="color: #007aff; text-decoration: underline;">link</a>)
          </div>
        </div>
      `
    }
  ];

  let activeEmailId = null;

  function renderInbox(data = inbox) {
    const container = document.getElementById('inbox-list');
    container.innerHTML = '';

    data.forEach(item => {
      const el = document.createElement('div');
      el.className = 'mail-row';
      el.onclick = () => openEmail(item.id);

      el.innerHTML = `
        <div class="unread-indicator-col">
          ${item.unread ? '<div class="unread-dot"></div>' : ''}
        </div>
        <div class="mail-main-col">
          <div class="mail-row-header">
            <div class="sender-title">${item.sender}</div>
            <div class="date-badge">
              <span>${item.date}</span>
              <span class="chevron">›</span>
            </div>
          </div>
          <div class="subject-line">${item.subject}</div>
          <div class="body-snippet">${item.snippet}</div>
        </div>
      `;
      container.appendChild(el);
    });
  }

  function openEmail(id) {
    activeEmailId = id;
    const item = inbox.find(x => x.id === id);
    if (!item) return;

    item.unread = false;
    renderInbox();

    document.getElementById('read-title').innerText = item.subject;
    document.getElementById('read-sender').innerText = item.sender;
    document.getElementById('read-time-badge').innerText = item.date;
    document.getElementById('read-avatar').innerText = item.sender.charAt(0).toUpperCase();
    document.getElementById('read-content').innerHTML = item.htmlBody;

    document.getElementById('drawer-from').innerText = item.senderEmail || item.sender;
    document.getElementById('drawer-date').innerText = item.fullDate || `${item.date}, 2026`;

    document.getElementById('sender-drawer').classList.remove('active');
    document.getElementById('chevron-drawer').innerText = '⌄';

    document.getElementById('detail-view').classList.add('active');
  }

  function toggleSenderDrawer() {
    const drawer = document.getElementById('sender-drawer');
    const chevron = document.getElementById('chevron-drawer');
    const isOpen = drawer.classList.toggle('active');
    chevron.innerText = isOpen ? '⌃' : '⌄';
  }

  function closeDetail() {
    document.getElementById('detail-view').classList.remove('active');
    document.getElementById('sender-drawer').classList.remove('active');
    activeEmailId = null;
  }

  function deleteEmail() {
    if (activeEmailId) {
      inbox = inbox.filter(x => x.id !== activeEmailId);
      closeDetail();
      renderInbox();
    }
  }

  function handleSearch() {
    const term = document.getElementById('search-input').value.toLowerCase();
    const filtered = inbox.filter(x => 
      x.sender.toLowerCase().includes(term) ||
      x.subject.toLowerCase().includes(term) ||
      x.snippet.toLowerCase().includes(term)
    );
    renderInbox(filtered);
  }

  function openCompose(prefix = '') {
    const modal = document.getElementById('compose-modal');
    modal.classList.add('active');
    if (activeEmailId) {
      const item = inbox.find(x => x.id === activeEmailId);
      if (item) {
        document.getElementById('compose-to').value = prefix ? item.senderEmail || item.sender : '';
        document.getElementById('compose-subject').value = prefix ? prefix + item.subject : '';
        return;
      }
    }
    document.getElementById('compose-to').value = '';
    document.getElementById('compose-subject').value = '';
  }

  function closeCompose() {
    document.getElementById('compose-modal').classList.remove('active');
  }

  renderInbox();
</script>
</body>
</html>
